name: Android 17 native device scaffold (source only)

on:
  push:
    branches: [seventeen, 'bringup/**']
  pull_request:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check independent product wiring
        run: python3 -m unittest discover -s tests -v
