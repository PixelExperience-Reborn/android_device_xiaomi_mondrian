name: AOSP17 aosp_mondrian package download (ServerHive)

# Makes a PixelExperience package of the build tree on the ServerHive runner
# downloadable from the run page (artifact), with the recovery image of the
# same build for the first installation and their SHA-256. Nothing is built.
# The repository is public: any signed-in GitHub user can download the
# artifact, which holds the Xiaomi blobs and firmware of the package.
on:
  push:
    branches: ['bringup/a17-mondrian-oem-vendor-os3-20261125']
    paths: ['.github/workflows/aosp17-package.yml']
  workflow_dispatch:
    inputs:
      package:
        description: 'Package file name (empty = the newest PixelExperience_mondrian-*.zip)'
        default: ''

# One job at a time on the build tree, after a running build.
concurrency:
  group: aosp17-mondrian-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on:
      group: mondrian-heavy
      labels: pe-mondrian-heavy
    timeout-minutes: 120
    steps:
      - name: Collect the package and the recovery image
        id: collect
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          out="$(dirname "$RUNNER_WORKSPACE")/pe-aosp17-mondrian/out/target/product/mondrian"
          newest="$(ls -t "$out"/PixelExperience_mondrian-*.zip 2>/dev/null | head -1 || true)"
          if [[ -n "${PACKAGE:-}" ]]; then
            if [[ ! "$PACKAGE" =~ ^PixelExperience_mondrian-[A-Za-z0-9._-]+\.zip$ ]]; then
              echo "not a package name: $PACKAGE"; exit 1
            fi
            package="$out/$PACKAGE"
          else
            package="$newest"
          fi
          if [[ -z "$package" || ! -f "$package" ]]; then
            echo "no package in $out"; exit 1
          fi
          dir="$RUNNER_TEMP/pe-package"
          rm -rf "$dir" && mkdir -p "$dir"
          cp "$package" "$dir/"
          # recovery.img belongs to the newest build only.
          if [[ "$package" == "$newest" && -f "$out/recovery.img" ]]; then
            cp "$out/recovery.img" "$dir/"
          fi
          (cd "$dir" && sha256sum -- * | tee SHA256SUMS)
          name="$(basename "$package" .zip)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### $name"
            echo '```'
            cat "$dir/SHA256SUMS"
            echo '```'
            echo "Download: the artifact $name at the bottom of this page (a zip of the files above)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: ${{ runner.temp }}/pe-package/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
